# ===============================================================
# 1. AUTH PORTAL (auth.bangkit.io)
# ===============================================================
server {
    listen 80;
    server_name auth.bangkit.io;

    # Certbot challenge path
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name auth.bangkit.io;

    ssl_certificate /etc/letsencrypt/live/auth.bangkit.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/auth.bangkit.io/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    location / {
        proxy_pass http://authelia:9091;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# ===============================================================
# 2. NALAR AI CODING HARNESS (nalar.bangkit.io)
# ===============================================================
server {
    listen 80;
    server_name nalar.bangkit.io;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name nalar.bangkit.io;

    ssl_certificate /etc/letsencrypt/live/nalar.bangkit.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nalar.bangkit.io/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Internal subrequest ke Authelia untuk verifikasi sesi TOTP
    location /authelia {
        internal;
        proxy_pass http://authelia:9091/api/verify;
        proxy_set_header Host $host;
        proxy_set_header X-Original-URL $scheme://$http_host$request_uri;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Content-Length "";
        proxy_pass_request_body off;
    }

    # Lokasi aplikasi NALAR
    location / {
        # Proteksi 2FA Authelia
        auth_request /authelia;
        auth_request_set $user $upstream_http_remote_user;

        # Jika belum login 2FA, lempar ke auth.bangkit.io
        error_page 401 =302 https://auth.bangkit.io/?rd=$scheme://$http_host$request_uri;

        proxy_pass http://nalar:3773;
        proxy_http_version 1.1;

        # WebSocket streaming untuk AI output & terminal
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}
