services:
  nalar:
    build:
      context: .
      dockerfile: Dockerfile.nalar
    container_name: nalar-engine
    restart: unless-stopped
    environment:
      - HOME=/data/home
      - T3CODE_HOME=/data/t3
      - T3CODE_HOST=0.0.0.0
      - T3CODE_PORT=3773
      - T3CODE_NO_BROWSER=true
      - TZ=Asia/Jakarta
    volumes:
      # Mount direktori project VPS Anda agar bisa dikerjakan langsung oleh NALAR
      - ${HOST_PROJECTS_DIR:-/root}:/workspace
      # Penyimpanan permanen database NALAR, pairing session, dan login CLI AI
      - nalar_data:/data
    networks:
      - coolify
      - nalar_network

  authelia:
    image: authelia/authelia:4.38
    container_name: nalar-authelia
    restart: unless-stopped
    volumes:
      - ./authelia/config:/config
    environment:
      - TZ=Asia/Jakarta
      - AUTHELIA_IDENTITY_VALIDATION_RESET_PASSWORD_JWT_SECRET=${JWT_SECRET}
      - AUTHELIA_SESSION_SECRET=${SESSION_SECRET}
      - AUTHELIA_STORAGE_ENCRYPTION_KEY=${STORAGE_ENCRYPTION_KEY}
    networks:
      - coolify
      - nalar_network

volumes:
  nalar_data:

networks:
  coolify:
    external: true
  nalar_network:
    driver: bridge
