services:
  nalar:
    build:
      context: .
      dockerfile: Dockerfile.nalar
    container_name: nalar_engine
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - T3CODE_HOST=0.0.0.0
      - PORT=3773
    volumes:
      # Folder project di VPS yang akan dikerjakan NALAR
      - ${HOST_PROJECTS_DIR:-./projects}:/workspace
      # Penyimpanan permanen state & konfigurasi NALAR
      - nalar_data:/data
    networks:
      - nalar_network

  authelia:
    image: authelia/authelia:4.38
    container_name: nalar_authelia
    restart: unless-stopped
    volumes:
      - ./authelia/config:/config
    environment:
      - TZ=Asia/Jakarta
      - AUTHELIA_IDENTITY_VALIDATION_RESET_PASSWORD_JWT_SECRET=${JWT_SECRET}
      - AUTHELIA_SESSION_SECRET=${SESSION_SECRET}
      - AUTHELIA_STORAGE_ENCRYPTION_KEY=${STORAGE_ENCRYPTION_KEY}
    networks:
      - nalar_network

  nginx:
    image: nginx:alpine
    container_name: nalar_proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    depends_on:
      - nalar
      - authelia
    networks:
      - nalar_network

  certbot:
    image: certbot/certbot
    container_name: nalar_certbot
    restart: unless-stopped
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"

volumes:
  nalar_data:

networks:
  nalar_network:
    driver: bridge
