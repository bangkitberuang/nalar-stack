server:
  address: "tcp://0.0.0.0:9091/"
  endpoints:
    authz:
      auth-request:
        implementation: "AuthRequest"

log:
  level: info

totp:
  issuer: "NALAR Security"
  period: 30
  digits: 6
  algorithm: "sha1"

authentication_backend:
  file:
    path: /config/users_database.yml

access_control:
  default_policy: two_factor

session:
  name: nalar_session
  same_site: lax
  expiration: 2h
  inactivity: 30m
  cookies:
    - domain: "bangkit.io"
      authelia_url: "https://auth.bangkit.io"
      default_redirection_url: "https://nalar.bangkit.io"

regulation:
  max_retries: 3
  find_time: 120
  ban_time: 300

storage:
  local:
    path: /config/db.sqlite3

notifier:
  filesystem:
    filename: /config/notification.txt
