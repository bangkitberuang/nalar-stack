server:
  address: "tcp://0.0.0.0:9091/"

log:
  level: info

identity_validation:
  reset_password:
    jwt_secret: nalar_reset_secret_replace_with_random_string_32chars

default_redirection_url: "https://nalar.bangkit.io"

totp:
  issuer: "NALAR Security"
  period: 30
  digits: 6
  algorithm: "SHA1"

authentication_backend:
  file:
    path: /config/users_database.yml
    password:
      algorithm: argon2id
      iterations: 3
      key_length: 32
      salt_length: 16
      memory: 64

access_control:
  default_policy: two_factor

session:
  name: nalar_session
  same_site: lax
  expiration: 2h
  inactivity: 30m
  cookies:
    - domain: "bangkit.io"
      authelia_url: "https://auth.bangkit.io"
      default_redirection_url: "https://nalar.bangkit.io"

regulation:
  max_retries: 3
  find_time: 120
  ban_time: 300

storage:
  local:
    path: /config/db.sqlite3

notifier:
  filesystem:
    filename: /config/notification.txt
